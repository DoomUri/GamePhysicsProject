<html>
	<head>
		<style type="text/css">
			#Bola{
				width: 20px;
				height: 20px;
				position: absolute;
				top: 50px;
				left: 50px;
				background: grey;
				border-radius: 100%;
				border: 2px solid black;
			}
		</style>	
		<script type="text/javascript">
			A=1;
			function Començar(){
				if(A==1){
					t=0;
					Moviment();
					Interval=setInterval(Moviment,10);
					A=0;
				}
			}
			function Moviment(){
				v=document.getElementById("velocitat").value;
				a=document.getElementById("acceleració").value;
				x=50+v*t+0.5*a*t*t
				document.getElementById("Bola").style.left=x+"px";
				t=t+0.01;			
			}
			function Parar(){
				if(A==0){
					clearInterval(Interval);
					document.getElementById("Bola").style.left=50+"px";
					A=1;
				}
			}
		</script>
	</head>
	<body>
		<div id="Bola"></div>
		<input type="text" placeholder="velocitat inicial... [m/s]" id="velocitat"></input>
		<input type="text" placeholder="acceleració... [m/s^2]" id="acceleració"></input>
		<input value="Començar" type="button" onclick="Començar()"></input>
		<input value="Parar" type="button" onclick="Parar()"></input>
	</body>
</html>
