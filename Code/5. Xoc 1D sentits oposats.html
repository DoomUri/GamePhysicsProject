<html>
	<head>
		<style type="text/css">
			#Bola1{
				position: absolute;
				width: 0px;
				height: 0px;
				top: 300px;
				left: 80px;
				background: grey;
				border-radius: 100%;
			}
			#Bola2{
				position: absolute;
				width: 0px;
				height: 0px;
				top: 300px;
				left: 1100px;
				background: yellow;
				border-radius: 100%;
			}
			#Indicador1{
				position: absolute;
				width: 20px;
				height: 20px;
				top: 40px;
				left: 200px;
				background: grey;
				border-radius: 100%;
				border: 2px solid black;
			}
			#Indicador2{
				position: absolute;
				width: 20px;
				height: 20px;
				top: 40px;
				right: 200px;
				background: yellow;
				border-radius: 100%;
				border: 2px solid black;
			}
			#velocitat1{
				position: absolute;
				left: 10px;
				width: 267px;
			}
			#velocitat2{
				position: absolute;
				right: 10px;
				width: 280px;
			}
			#massa1{
				position: absolute;
				top: 50px;
				left: 10px;
			}
			#massa2{
				position: absolute;
				top: 50px;
				right: 10px;
			}
			#aplicar{
				position: absolute;
				left: 500px;
				right: 500px;
			}
			#xoc{
				position: absolute;
				left: 500px;
				right: 500px;
				top: 50px;
			}
			#parar{
				position: absolute;
				left: 500px;
				right: 500px;
				top: 95px;
			}
			#x{
				background: white;
				width: 5px;
				height: 5px;
				position: absolute;
				border-radius: 100%;
			}
		</style>
		<script type="text/javascript">
			control=0;
			control2=0;
			control3=0;
			control4=1;
			function Aplicar(){
				if(control3==0){
					m1=document.getElementById("massa1").value;
					m2=document.getElementById("massa2").value;
					if(m1>500||m1<1){
						alert("La massa del cos 1 ha de tenir un valor entre 1 Kg i 1100 Kg");
						m1=0;
					}
					if(m2>500||m2<1){
						alert("La massa del cos 2 ha de tenir un valor entre 1 Kg i 1100 Kg");
						m2=0;
					}
					document.getElementById("Bola1").style.width=m1+"px";
					document.getElementById("Bola2").style.width=m2+"px";
					document.getElementById("Bola1").style.height=m1+"px";
					document.getElementById("Bola2").style.height=m2+"px";
					top1=300-(m1/2);
					top2=300-(m2/2);
					document.getElementById("Bola1").style.top=top1+"px";
					document.getElementById("Bola2").style.top=top2+"px";
					left1=80-(m1/2);
					left2=1100-(m2/2);
					document.getElementById("Bola1").style.left=left1+"px";
					document.getElementById("Bola2").style.left=left2+"px";
					document.getElementById("x").style.background="white";
					control=1;
				}
			}
			function Començar(){
				if(control4==1){
					if(control==0){
						alert("No pots simular el xoc sense aplicar les masses");
					}	
						v1=document.getElementById("velocitat1").value;
						v2=document.getElementById("velocitat2").value;
						if(v1>5000||v1<0){
							alert("La velocitat del cos 1 ha de tenir un valor entre 0 m/s i 5000 m/s");
							control2=0;
						}
						if(v2>5000||v2<0){
							alert("La velocitat del cos 2 ha de tenir un valor entre 0 m/s i 5000 m/s");
							control2=0;
						}
						if(v2==0 && v1==0){
							alert("Algun dels dos cossos s'ha de moure a una velocitat diferent de 0 m/s");
							control2=0;
						}
						if(v2<5001 && v2>-1 && v1<5001 && v1>-1 && !(v2==0 && v1==0)){
							control2=1;
						}
					if(control==1 && control2==1){
						control3=1;
						left0=Number(left1)+Number(m1);
						x=(Number(v2)*Number(left0)+Number(v1)*Number(left2))/(Number(v1)+Number(v2));
						xt=Number(x)-2.5;
						document.getElementById("x").style.background="black";
						document.getElementById("x").style.left=xt+"px";
						document.getElementById("x").style.top=297,5;
						t=0;
						Interval=setInterval(Moviment1,1);
						Intervalx=setInterval(Res,1000);
						xoc();
						control4=0;	
					}	
				}		
			}
			function Moviment1(){
				x1=left1+v1*t;
				x2=left2-v2*t;
				document.getElementById("Bola1").style.left=x1+"px";
				document.getElementById("Bola2").style.left=x2+"px";
				t=t+0.01;
				y1=Number(x1)+Number(m1)-1;
				y2=Number(x2)+1;
				if(y1>x||y2<x){
					clearInterval(Interval);
					t=0;
					Intervalx=setInterval(Moviment2,1);			
					Interval=setInterval(Res,1000);
				}
			}
			function xoc(){
				v1f=(((Number(m1)-Number(m2))/(Number(m1)+Number(m2)))*Number(v1))+(((2*Number(m2))/(Number(m1)+Number(m2)))*(-Number(v2)));
				v2f=(((2*Number(m1))/(Number(m1)+Number(m2)))*v1)-(((Number(m1)-Number(m2))/(Number(m1)+Number(m2)))*(-Number(v2)));
			}
			function Moviment2(){	
				x1f=(x-m1)+v1f*t;
				x2f=x+v2f*t;
				document.getElementById("Bola1").style.left=x1f+"px";
				document.getElementById("Bola2").style.left=x2f+"px";
				t=t+0.01;	
			}
			function Parar(){
				clearInterval(Interval);
				clearInterval(Intervalx);
				control3=0;
				control=0;
				control4=1;
			}
			function Res(){
			}		
		</script>
	</head>
	<body>
		<div id="Bola1"></div>
		<div id="Bola2"></div>
		<div id="Indicador1">-1-</div>
		<div id="Indicador2">-2-</div>
		<div id="x"></div>
		<input type="text" id="velocitat1" placeholder="Velocitat inicial cos 1 cap a la dreta ... [m/s]"></input>
		<input type="text" id="velocitat2" placeholder="Velocitat inicial cos 2 cap a l'esquerra ... [m/s]"></input>
		<input type="text" id="massa1" placeholder="Massa cos 1... [Kg]"></input>
		<input type="text" id="massa2" placeholder="Massa cos 2... [Kg]"></input>
		<input type="button" id="aplicar" value="Aplicar Masses" onclick="Aplicar()"></input>
		<input type="button" id="xoc" value="Simular Xoc" onclick="Començar()"></input>
		<input type="button" value="Aturar Xoc" onclick="Parar()" id="parar"></input>
	</body>
</html>
